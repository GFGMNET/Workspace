# Version 1.0 of Project Workspace in Rust (see docs/MIGRATION-RUST.md). Phase 1: prototype.
[workspace]
resolver = "2"
members = ["crates/pw-core", "crates/pw-server", "crates/pw-app"]

[workspace.package]
version = "0.9.0-proto"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rust2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "signal", "process", "io-util"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
regex = "1"
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
