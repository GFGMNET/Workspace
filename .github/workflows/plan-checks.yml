# Runs the feasibility checks of the plans in docs/plans/checks/ on Windows and Linux machines,
# with test servers set up only for the run. Started by hand (Actions → "Plan checks") or by Claude.
name: Plan checks

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Which plan to check: all, git-svn, vscode, signing, glpi, dashboard, comfyui, lmstudio, help or forgejo"
        default: all

permissions:
  contents: read

jobs:
  check:
    if: inputs.plan == 'all' || inputs.plan == 'git-svn'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, svnweb: both }
          - { os: windows-latest, svnweb: http }     # VisualSVN Server runs either http or https,
          - { os: windows-latest, svnweb: https }    # so Windows runs twice
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install SVN, ssh server, SVN web server (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion openssh-server apache2 apache2-utils libapache2-mod-svn > /dev/null
          sudo mkdir -p /run/sshd
      - name: Install SVN (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y --no-progress sliksvn > /dev/null
          echo "C:/Program Files/SlikSvn/bin" >> "$GITHUB_PATH"
      - name: SVN web server (Windows, VisualSVN Server)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\visualsvn.msi"
          Invoke-WebRequest https://www.visualsvn.com/files/VisualSVN-Server-5.4.6-x64.msi -OutFile $msi
          $ssl = if ('${{ matrix.svnweb }}' -eq 'https') { 'USE_SSL=1 SSLSERVERPORT=8443' } else { 'USE_SSL=0 SERVERPORT=8082' }
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart $ssl" -Wait -PassThru
          Write-Host "msiexec exit: $($p.ExitCode)"
          $mod = Get-ChildItem "C:\Program Files\VisualSVN Server" -Recurse -Filter VisualSVN.psd1 -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "module: $($mod.FullName)"
          Import-Module $mod.FullName
          New-SvnRepository -Name svnrepo | Out-Null
          New-SvnLocalUser -Name alice -Password (ConvertTo-SecureString 's3cret-XYZ' -AsPlainText -Force) | Out-Null
          Get-Command Add-SvnAccessRule -Syntax | Write-Host
          Add-SvnAccessRule -Repository svnrepo -Path / -AccountName alice -Access ReadWrite | Out-Null
          if ('${{ matrix.svnweb }}' -eq 'https') { $u = "https://localhost:8443/svn/svnrepo/trunk"; "SVN_HTTPS_URL=$u" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          else { $u = "http://localhost:8082/svn/svnrepo/trunk"; "SVN_HTTP_URL=$u" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          "SVN_WEB_ONLY=${{ matrix.svnweb }}" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "SVN web server: $u"
      - name: ssh server (Windows, built-in OpenSSH)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' | Select-Object -First 1
          Write-Host "OpenSSH server: $($cap.Name) $($cap.State)"
          if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $cap.Name | Out-Null }
          Start-Service sshd; Stop-Service sshd
          New-ItemProperty HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -Value 'C:\Program Files\Git\bin\bash.exe' -PropertyType String -Force | Out-Null
          $cfg = 'C:\ProgramData\ssh\sshd_config'   # own lines at the top: the default file ends with a Match block
          Set-Content $cfg (@('Port 2222','ListenAddress 127.0.0.1','AcceptEnv GIT_PROTOCOL','PasswordAuthentication no') + (Get-Content $cfg))
          & C:\Windows\System32\OpenSSH\sshd.exe -t; Write-Host "config test: $LASTEXITCODE"
          $k = 'C:\ProgramData\ssh\administrators_authorized_keys'
          New-Item -ItemType File -Force $k | Out-Null
          icacls $k /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          Start-Service sshd
          "SSH_AUTH_KEYS=$k" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "ssh server ready on 127.0.0.1:2222"
      - name: Git/SVN integration plan — read access with login
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: sh docs/plans/checks/git-svn-read-check.sh

  vscode:
    if: inputs.plan == 'all' || inputs.plan == 'vscode'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PW_INSTALL: ${{ github.workspace }}
      CHECK_OUT: ${{ github.workspace }}/check-out
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the app server (1.0)
        working-directory: rust
        run: cargo build -p pw-server --release --locked
      - name: VS Code (portable, own folder so the check can also hide it)
        run: |
          mkdir -p "$RUNNER_TEMP/vscode" check-out
          if [ "$RUNNER_OS" = Windows ]; then
            curl -sSL -o "$RUNNER_TEMP/vscode.zip" "https://update.code.visualstudio.com/latest/win32-x64-archive/stable"
            unzip -q "$RUNNER_TEMP/vscode.zip" -d "$RUNNER_TEMP/vscode"
            echo "$RUNNER_TEMP/vscode/bin" >> "$GITHUB_PATH"
          else
            curl -sSL -o "$RUNNER_TEMP/vscode.tgz" "https://update.code.visualstudio.com/latest/linux-x64/stable"
            tar -xzf "$RUNNER_TEMP/vscode.tgz" -C "$RUNNER_TEMP/vscode" --strip-components=1
            echo "$RUNNER_TEMP/vscode/bin" >> "$GITHUB_PATH"
          fi
      - name: Browser for the check
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium > /dev/null; else npx playwright install chromium > /dev/null; fi
      - name: VS Code plan — editor opens inside the app without a button
        env:
          PW_SERVER_CMD: ${{ github.workspace }}/rust/target/release/workspace-server {port}
        run: code --version | head -1; node docs/plans/checks/vscode-check.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-check-${{ matrix.os }}
          path: check-out/

  signing:
    if: inputs.plan == 'all' || inputs.plan == 'signing'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the app server (1.0) to have a real program to sign
        working-directory: rust
        run: cargo build -p pw-server --release --locked
      - name: Signing plan — own certificate
        shell: pwsh
        timeout-minutes: 10
        run: pwsh docs/plans/checks/signing-check.ps1 -Exe rust/target/release/workspace-server.exe

  glpi:
    if: inputs.plan == 'all' || inputs.plan == 'glpi'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Ticketsystem plan — GLPI read and write, by category
        env:
          GLPI_URL: https://ticket.bbdi42.de
          GLPI_USER: Hermes
          GLPI_TOKEN: ${{ secrets.GLPI_TOKEN }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
        run: node docs/plans/checks/glpi-check.js

  dashboard:
    if: inputs.plan == 'all' || inputs.plan == 'dashboard'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PW_INSTALL: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the app server (1.0)
        working-directory: rust
        run: cargo build -p pw-server --release --locked
      - name: Browsers (Chromium + WebKit)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium webkit > /dev/null; else npx playwright install chromium webkit > /dev/null; fi
      - name: Dashboard plan — edit, move, resize; data per feature; saved per project
        env:
          PW_SERVER_CMD: ${{ github.workspace }}/rust/target/release/workspace-server {port}
        run: node docs/plans/checks/dashboard-check.js

  # docs/plans/COMFYUI.md: a real ComfyUI (latest release, on the processor — no graphics card, no AI model needed),
  # reached by its network address; then the results are shown in WebKit (Linux) and Edge = WebView2 (Windows).
  comfyui:
    if: inputs.plan == 'all' || inputs.plan == 'comfyui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: ComfyUI (latest release)
        run: |
          tag=$(git ls-remote --tags --sort=-v:refname https://github.com/comfyanonymous/ComfyUI 'v*' | grep -v '\^{}' | head -1 | sed 's#.*refs/tags/##')
          echo "ComfyUI $tag"
          git clone -q --depth 1 --branch "$tag" https://github.com/comfyanonymous/ComfyUI "$RUNNER_TEMP/ComfyUI"
          cd "$RUNNER_TEMP/ComfyUI"
          pip install -q torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          nohup python main.py --cpu --listen 0.0.0.0 --port 8188 > "$RUNNER_TEMP/comfy.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8188/system_stats > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8188/system_stats | head -c 400; echo
      - name: Check (workflows, prompt text, run, results, saved, network)
        run: |
          ip=$(hostname -I | awk '{print $1}')
          COMFY_URL="http://$ip:8188" node docs/plans/checks/comfyui-check.js "$RUNNER_TEMP/out"
      - name: ComfyUI log
        if: always()
        run: tail -n 60 "$RUNNER_TEMP/comfy.log" || true
      - name: Gallery in WebKit (Linux)
        if: always()
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps webkit > /dev/null
          node docs/plans/checks/comfyui-media-check.js "$RUNNER_TEMP/out" webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comfyui-results
          path: ${{ runner.temp }}/out

  comfyui-windows:
    if: always() && (inputs.plan == 'all' || inputs.plan == 'comfyui')
    needs: comfyui
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: comfyui-results
          path: ${{ runner.temp }}/out
      - name: Gallery in Edge (= WebView2, Windows)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null
          node docs/plans/checks/comfyui-media-check.js "$RUNNER_TEMP/out" msedge

  # COMFYUI.md: results also in the Gallery (video and audio too) — the real ComfyUI results, served by the 1.0 app server,
  # played in WebKit (Linux) and Edge = WebView2 (Windows).
  comfyui-gallery:
    if: always() && (inputs.plan == 'all' || inputs.plan == 'comfyui')
    needs: comfyui
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, engine: webkit }
          - { os: windows-latest, engine: msedge }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PW_INSTALL: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the app server (1.0)
        working-directory: rust
        run: cargo build -p pw-server --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: comfyui-results
          path: ${{ runner.temp }}/out
      - name: Browser
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps webkit > /dev/null; fi
      - name: Gallery — pictures, video, audio served by the app
        env:
          PW_SERVER_CMD: ${{ github.workspace }}/rust/target/release/workspace-server {port}
        run: node docs/plans/checks/comfyui-gallery-check.js "$RUNNER_TEMP/out" ${{ matrix.engine }}

  # LM Studio plan (Chat feature, engine: lmstudio): a real LM Studio without screen (llmster) with a small Qwen model,
  # on the processor; the app's file tools (read, create, change, delete, run) are played by the check.
  lmstudio:
    if: inputs.plan == 'all' || inputs.plan == 'lmstudio'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: LM Studio (llmster) + Qwen model
        run: |
          curl -fsSL https://lmstudio.ai/install.sh | bash
          export PATH="$HOME/.lmstudio/bin:$HOME/.local/bin:$PATH"; echo "$HOME/.lmstudio/bin" >> "$GITHUB_PATH"
          lms version || true
          lms daemon up
          lms get qwen/qwen3-1.7b --yes || lms get qwen3-1.7b --yes || lms get qwen3-1.7b -y
          lms ls
          key=$(lms ls --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const m=a.find(x=>/qwen3/i.test(x.modelKey||x.path||""));console.log(m.modelKey||m.path)})')
          echo "model: $key"; echo "LMS_MODEL=$key" >> "$GITHUB_ENV"
          lms load "$key" --yes --context-length 8192 || lms load "$key" --yes
          lms server start --port 1234 --bind 0.0.0.0 || lms server start --port 1234
          sleep 3; curl -s http://127.0.0.1:1234/v1/models | head -c 400; echo
          lms server status || true
      - name: Check (network, model, stream, read, create, change, delete, run, safety)
        run: |
          ip=$(hostname -I | awk '{print $1}')
          if curl -sf "http://$ip:1234/v1/models" > /dev/null; then u="http://$ip:1234"; else echo "not reachable by network address"; u="http://$ip:1234"; fi
          LMS_URL="$u" node docs/plans/checks/lmstudio-check.js "$RUNNER_TEMP/lms"

  lmstudio-windows:
    if: inputs.plan == 'all' || inputs.plan == 'lmstudio'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The app's file tools on Windows (the model's calls from the Linux run)
        env:
          REPLAY: '1'
        run: node docs/plans/checks/lmstudio-check.js "$env:RUNNER_TEMP\lms"

  # Help & wiki inside the app (1.2.2): the real wiki pages with the app's renderer, offline, in WebKit (Linux) and Edge (Windows).
  help:
    if: inputs.plan == 'all' || inputs.plan == 'help'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, engines: 'chromium,webkit' }
          - { os: windows-latest, engines: msedge }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Browsers
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium webkit > /dev/null; fi
      - name: Help & wiki — bundle, order, links, pictures offline, search, (i) hover/click
        env:
          ENGINES: ${{ matrix.engines }}
        run: node docs/plans/checks/help-check.js

  # Forgejo in the issues feature: a real Forgejo (latest release, Docker), reached by its network address.
  forgejo:
    if: inputs.plan == 'all' || inputs.plan == 'forgejo'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Forgejo (latest release)
        run: |
          tag=$(curl -s "https://codeberg.org/api/v1/repos/forgejo/forgejo/releases?limit=10" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).filter(x=>!x.prerelease&&/^v\d+\.\d+\.\d+$/.test(x.tag_name));console.log(r[0].tag_name.slice(1))})')
          echo "Forgejo $tag"
          docker run -d --name forgejo -p 3000:3000 -e FORGEJO__security__INSTALL_LOCK=true -e FORGEJO__server__ROOT_URL=http://localhost:3000/ codeberg.org/forgejo/forgejo:$tag
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/v1/version && break; sleep 2; done; echo
          docker exec -u git forgejo forgejo admin user create --admin --username alice --password 's3cret-Forgejo-1' --email alice@example.com --must-change-password=false
          t=$(docker exec -u git forgejo forgejo admin user generate-access-token --username alice --token-name check --scopes all --raw)
          echo "::add-mask::$t"; echo "FORGEJO_TOKEN=$t" >> "$GITHUB_ENV"
      - name: Check (network, list, fields, filter, private repo, create + comment)
        run: |
          ip=$(hostname -I | awk '{print $1}')
          FORGEJO_URL="http://$ip:3000" node docs/plans/checks/forgejo-check.js
