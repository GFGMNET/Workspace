# Publishes a release. Two ways:
#  - Actions → Release → "Run workflow": releases the version in package.json (tag v<version> is created)
#  - or push a tag:  git tag v0.4.0 && git push origin v0.4.0   (must match package.json)
# Release notes: docs/releases/v<version>.md if it exists, otherwise generated by GitHub.
# Installed workspaces check the latest release once a week and offer the update.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Work out the version
        id: v
        run: |
          p=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            t="$GITHUB_REF_NAME"
            if [ "${t#v}" != "$p" ]; then echo "::error::Tag $t does not match package.json version $p"; exit 1; fi
          else
            t="v$p"
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then echo "::error::$t already exists — raise the version in package.json first"; exit 1; fi
          fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      - name: Run the tests
        run: node app/test/smoke.js
      - name: Build the program zip (everything except client data)
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=project-workspace/ -o "dist/project-workspace-${{ steps.v.outputs.tag }}.zip" HEAD
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then n=(--notes-file "$notes"); else n=(--generate-notes); fi
          gh release create "$TAG" "dist/project-workspace-${TAG}.zip" --target "$GITHUB_SHA" --title "Project Workspace ${TAG}" "${n[@]}"
