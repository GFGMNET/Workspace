# Publishes the wiki pages from docs/ to the GitHub wiki on every push to main, and once a day (vote counts).
# One-time setup: create the first wiki page on GitHub (GitHub creates the wiki repository then).
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['docs/**', 'tools/build-wiki.js', 'tools/vote-counts.js', 'tools/issue-list.js', '.github/workflows/wiki.yml']
  workflow_dispatch:
  # once a day, so the vote counts on "Vote for features" and the lists (hiccups, bugs, security fixes) stay current (maintainer, 2026-11-25)
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build wiki pages
        run: node tools/build-wiki.js build/wiki
      - name: Vote counts on "Vote for features"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '[ -f build/wiki/Vote-for-features.md ] && node tools/vote-counts.js build/wiki/Vote-for-features.md || echo "no vote page"'
      - name: Lists on "Known hiccups", "Known bugs", "Security fixes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/issue-list.js build/wiki/Known-hiccups.md hiccup all
          node tools/issue-list.js build/wiki/Known-bugs.md bug all
          node tools/issue-list.js build/wiki/Security-fixes.md security closed
      - name: Push to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo || {
            echo "::error::The wiki does not exist yet. Open the Wiki tab on GitHub, create the first page once, then re-run this workflow."; exit 1; }
          rsync -a --delete --exclude .git build/wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki is up to date"; exit 0; fi
          git commit -m "Update wiki from ${GITHUB_SHA::7}"
          git push
