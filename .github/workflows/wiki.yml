# Publishes the wiki pages from docs/ to the GitHub wiki on every push to main.
# One-time setup: create the first wiki page on GitHub (GitHub creates the wiki repository then).
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['docs/**', 'tools/build-wiki.js', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build wiki pages
        run: node tools/build-wiki.js build/wiki
      - name: Push to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo || {
            echo "::error::The wiki does not exist yet. Open the Wiki tab on GitHub, create the first page once, then re-run this workflow."; exit 1; }
          rsync -a --delete --exclude .git build/wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki is up to date"; exit 0; fi
          git commit -m "Update wiki from ${GITHUB_SHA::7}"
          git push
