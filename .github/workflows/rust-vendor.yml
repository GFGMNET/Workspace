# Helper for development: puts the crates that pw-core and pw-server need on the branch `rust-vendor`,
# so Claude's work environment (no access to crates.io) can build and test them offline.
# Run by hand when dependencies change: Actions → "Rust vendor branch" → Run workflow.
name: Rust vendor branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Vendor the crates of pw-core and pw-server (not the desktop app)
        run: |
          mkdir -p /tmp/v && cp -r rust/crates/pw-core rust/crates/pw-server /tmp/v/
          sed -e 's/members = \[.*\]/members = ["pw-core", "pw-server"]/' rust/Cargo.toml > /tmp/v/Cargo.toml
          cd /tmp/v && cargo generate-lockfile && cargo vendor --versioned-dirs vendor > /dev/null
          du -sh vendor; ls vendor | wc -l
      - name: Lock file of the whole Rust workspace (incl. the desktop app), to commit to main as rust/Cargo.lock
        run: cd rust && cargo generate-lockfile && mkdir -p /tmp/v/full && cp Cargo.lock /tmp/v/full/Cargo.lock
      - name: Push to the branch rust-vendor
        run: |
          cd /tmp/v
          git init -q -b rust-vendor
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock full vendor
          git commit -qm "Vendored crates for pw-core and pw-server ($(date -u +%F))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" rust-vendor
