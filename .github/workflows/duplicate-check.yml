# Comments possible duplicates on a new idea (label idea; compared with open ideas and vote issues) or a bug
# (label bug; compared with all bugs, open and fixed) and adds the label possible-duplicate. Maintainer, 2026-11-25.
name: Check for duplicate ideas and bugs

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  check-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // label of the new issue → the labels it is compared with (and which states)
            const WATCH = {
              idea: { against: ['idea', 'vote'], state: 'open', what: 'idea' },
              bug:  { against: ['bug'],          state: 'all',  what: 'bug'  },
            };
            const THRESHOLD = 0.4;       // 0–1, higher = stricter

            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            // on "labeled" only react to the label that was just added (avoid repeat runs)
            const key = context.payload.action === 'labeled'
              ? context.payload.label.name
              : Object.keys(WATCH).find(k => labels.includes(k));
            const watch = WATCH[key];
            if (!watch || !labels.includes(key)) return;
            if (labels.includes('possible-duplicate')) return;

            // words of the title, without the prefixes every issue of a kind has ("Idea:", "Vote:", "Bug:")
            const SKIP = new Set(['idea', 'vote', 'bug', 'the', 'and', 'for', 'with', 'not']);
            const words = s => new Set(((s.toLowerCase().match(/[a-z0-9]{3,}/g)) || []).filter(w => !SKIP.has(w)));
            const similarity = (a, b) => {
              const inter = [...a].filter(w => b.has(w)).length;
              const union = new Set([...a, ...b]).size;
              return union ? inter / union : 0;
            };

            let others = [];
            for (const label of watch.against) {
              others = others.concat(await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: label,
                state: watch.state,
                per_page: 100,
              }));
            }
            const seen = new Set();
            others = others.filter(o => !seen.has(o.number) && seen.add(o.number));

            const mine = words(issue.title);
            const matches = others
              .filter(o => o.number !== issue.number && !o.pull_request)
              .map(o => ({ o, score: similarity(mine, words(o.title)) }))
              .filter(m => m.score >= THRESHOLD)
              .sort((a, b) => b.score - a.score)
              .slice(0, 5);

            if (!matches.length) return;

            const list = matches
              .map(m => `- #${m.o.number} ${m.o.title}${m.o.state === 'closed' ? ' (closed)' : ''} (${Math.round(m.score * 100)}% similar)`)
              .join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `👀 This ${watch.what} might already exist:\n\n${list}\n\nPlease check these before we continue.`,
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['possible-duplicate'],
            });
