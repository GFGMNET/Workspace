# Weekly check of the libraries the app bundles (tools/vendor.json: Mermaid, highlight.js …): newer versions and known
# vulnerabilities → issue. (The Electron part was removed with the old 0.x app, #125; the Rust libraries are checked by
# rust-security.yml.) Run by hand: Actions → "Security check" → Run workflow.
name: Security check

on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bundled libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const { execSync } = require('child_process');
          const list = require('./tools/vendor.json'); const out = [];
          for (const [name, v] of Object.entries(list)) {
            if (name.startsWith('_')) continue;
            const latest = execSync(`npm view ${name} version`).toString().trim();
            let advisories = [];
            try {
              const body = JSON.stringify({ [name]: [v.version] });
              advisories = Object.values(JSON.parse(execSync(`curl -fsS -X POST -H 'Content-Type: application/json' -d '${body}' https://registry.npmjs.org/-/npm/v1/security/advisories/bulk`).toString())).flat();
            } catch {}
            console.log(`${name}: bundled ${v.version}, latest ${latest}, advisories ${advisories.length}`);
            if (advisories.length || latest !== v.version) out.push({ name, ...v, latest, advisories });
          }
          for (const x of out) {
            const sec = x.advisories.length > 0;
            const title = `${sec ? 'Security: ' : ''}Update bundled ${x.name} ${x.version} → ${x.latest}`;
            const open = execSync(`gh issue list --state open --search ${JSON.stringify('in:title "Update bundled ' + x.name + ' ' + x.version)} --json number --jq '.[].number'`).toString().trim();
            if (open) continue;
            if (!sec && process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' && new Date().getDate() > 7) continue; // plain updates: once a month
            const body = `The app bundles **${x.name} ${x.version}** (\`${x.path}\`); the newest is **${x.latest}**.\n\n` +
              (sec ? `Known vulnerabilities:\n${x.advisories.map(a => `- ${a.severity}: [${a.title}](${a.url}) (vulnerable: ${a.vulnerable_versions})`).join('\n')}\n\n` : '') +
              `Update: \`${x.update}\`, then set the version in \`tools/vendor.json\`, run the tests and release.`;
            require('fs').writeFileSync('/tmp/body.md', body);
            execSync(`gh issue create --title ${JSON.stringify(title)} --body-file /tmp/body.md ${sec ? '--label security' : '--label enhancement'}`, { stdio: 'inherit' });
          }
          JS
