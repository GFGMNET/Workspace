# Diagnostic: starts the workspace + VS Code's web server (code serve-web) on a runner, opens the
# VS Code tab in Chromium and records what happens (screenshot, console, failed requests).
# Actions → "VS Code tab check" → Run workflow. Results: the run's artifacts.
name: VS Code tab check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: VS Code CLI
        run: |
          curl -fsSL "https://update.code.visualstudio.com/latest/cli-alpine-x64/stable" -o vscode-cli.tar.gz
          tar -xzf vscode-cli.tar.gz
          ./code --version
          echo "IDE_COMMAND=$PWD/code serve-web --host 127.0.0.1 --port {port} --connection-token {token} --server-base-path {base} --accept-server-license-terms" >> "$GITHUB_ENV"
      - name: Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start the workspace and VS Code
        run: |
          export WORKSPACE_DIR="$RUNNER_TEMP/pw-data"
          node app/server.js 4399 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 20); do sleep 1; curl -fsS http://localhost:4399/api/info >/dev/null && break; done
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:4399/api/examples
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' --max-time 180 http://localhost:4399/api/ide/start | tee "$RUNNER_TEMP/ide-start.json"
      - name: Open the VS Code tab in Chromium
        run: |
          mkdir -p out
          cat > /tmp/pw/check.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const out = process.argv[2]; const log = [];
            const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1400, height: 900 } });
            p.on('console', m => log.push(`console.${m.type()}: ${m.text()}`));
            p.on('pageerror', e => log.push(`pageerror: ${e.message}`));
            p.on('requestfailed', r => log.push(`failed: ${r.method()} ${r.url()} ${r.failure() && r.failure().errorText}`));
            p.on('response', r => { if (r.status() >= 400) log.push(`http ${r.status()}: ${r.request().method()} ${r.url()}`); });
            p.on('websocket', ws => { log.push(`ws open: ${ws.url()}`); ws.on('close', () => log.push(`ws close: ${ws.url()}`)); ws.on('socketerror', e => log.push(`ws error: ${e}`)); });
            await p.goto('http://localhost:4399/#/p/test/_ide');
            await p.waitForTimeout(45000);
            await p.screenshot({ path: out + '/page.png' });
            log.push('frames: ' + p.frames().map(x => x.url().slice(0, 100)).join(' | '));
            for (const f of p.frames().filter(x => x !== p.mainFrame())) {
              try {
                const r = await f.evaluate(() => ({ wb: !!document.querySelector('.monaco-workbench'), parts: [...document.querySelectorAll('.part')].map(x => x.id || x.className.split(' ').slice(0, 2).join('.')).slice(0, 8), text: document.body.innerText.slice(0, 200) }));
                log.push(`frame ${f.url().slice(0, 120)} → workbench ${r.wb}, parts ${r.parts.join(',')}, text ${JSON.stringify(r.text)}`);
              } catch (e) { log.push('frame eval: ' + e.message); }
            }
            require('fs').writeFileSync(out + '/log.txt', log.join('\n'));
            await b.close();
          })();
          JS
          node /tmp/pw/check.js "$PWD/out" || true
          # the same in Electron (the desktop app's engine), with the app's window settings
          (cd /tmp/pw && npm i electron@45 >/dev/null 2>&1)
          cat > /tmp/pw/el.js <<'JS'
          const { app, BrowserWindow } = require('electron');
          app.commandLine.appendSwitch('no-sandbox');
          app.whenReady().then(async () => {
            const w = new BrowserWindow({ width: 1400, height: 900, show: true, webPreferences: { contextIsolation: true, sandbox: true } });
            const log = [];
            w.webContents.on('console-message', (e) => { const m = e.message || ''; if (!/AgentHost|ChatModelSelection/.test(m)) log.push('console: ' + m.slice(0, 200)); });
            w.webContents.on('did-fail-load', (e, c, d, u) => log.push(`fail ${c} ${d} ${u}`));
            await w.loadURL('http://localhost:4399/#/p/test/_ide');
            await new Promise(r => setTimeout(r, 45000));
            for (const f of w.webContents.mainFrame.framesInSubtree) {
              if (f === w.webContents.mainFrame) continue;
              try { const r = await f.executeJavaScript('JSON.stringify({wb: !!document.querySelector(".monaco-workbench"), text: document.body.innerText.slice(0,200)})'); log.push(`frame ${f.url.slice(0, 120)} → ${r}`); } catch (e) { log.push('frame eval ' + e.message); }
            }
            const img = await w.webContents.capturePage({ x: 300, y: 200, width: 800, height: 500 });
            const bmp = img.toBitmap(); let sum = 0; for (let i = 0; i < bmp.length; i += 4) sum += (bmp[i] + bmp[i + 1] + bmp[i + 2]) / 3;
            log.push('electron ' + process.versions.electron + ', average brightness of the VS Code area: ' + Math.round(sum / (bmp.length / 4)) + ' (0 = black)');
            require('fs').writeFileSync(process.argv[process.argv.length - 1] + '/electron.png', img.toPNG());
            console.log(log.join('\n')); app.exit(0);
          });
          JS
          xvfb-run -a /tmp/pw/node_modules/.bin/electron --no-sandbox /tmp/pw/el.js "$PWD/out" 2>&1 | grep -v "dbus\|Gtk\|ERROR:viz" | tee out/electron.txt || true
          cp "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/ide-start.json" out/ 2>/dev/null || true
          curl -fsS http://localhost:4399/api/ide > out/ide-status.json || true
          tail -80 out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ide-check
          path: out
