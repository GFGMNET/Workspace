# Code scanning: looks for security problems in our own code (JavaScript) and the workflows.
# Results: GitHub → Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 3 * * 3'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - app/public/vendor
              - app/lib/vendor
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
