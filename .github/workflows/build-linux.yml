# Builds the Linux desktop app: "project-workspace" (Electron: its own window, Node and the browser
# engine included) + the app folder, zipped (the executable bits are kept).
#  - Run by hand: Actions → "Build Linux app" → Run workflow  (zips appear under the run's Artifacts)
#  - Called by the Release workflow: the zips are attached to the release
name: Build Linux app

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: Commit to build (draft releases have no tag yet)
        type: string
        required: false
      tag:
        description: Release tag to attach the zips to
        type: string
        required: false

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: v
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          node --version; uname -m
      - name: Tests
        run: node app/test/smoke.js
      - name: Get Electron
        id: e
        run: |
          npm install --prefix build/electron "electron@$(tr -d '[:space:]' < tools/electron/electron-version)" --no-save --no-audit --no-fund --foreground-scripts
          # newer npm versions may skip install scripts: download Electron's files explicitly
          [ -d build/electron/node_modules/electron/dist ] || node build/electron/node_modules/electron/install.js
          [ -x build/electron/node_modules/electron/dist/electron ] || { echo "Electron download failed"; exit 1; }
          echo "electron=$(node -p "require('./build/electron/node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Assemble the package folder
        run: |
          out=dist/project-workspace
          mkdir -p "$out"
          # 1. the Electron runtime, renamed, with our bootstrap instead of Electron's default app
          cp -a build/electron/node_modules/electron/dist/. "$out/"
          mv "$out/electron" "$out/project-workspace-bin"
          # start script: portable zips can't carry the root-owned sandbox helper, so Chromium needs
          # --no-sandbox on the command line unless chrome-sandbox was set up (root, mode 4755)
          cat > "$out/project-workspace" <<'SH'
          #!/bin/sh
          # Starts Project Workspace (desktop app). Options: a port number, --browser, --version.
          d=$(dirname "$(readlink -f "$0")")
          s=--no-sandbox
          if [ -u "$d/chrome-sandbox" ] && [ "$(stat -c %u "$d/chrome-sandbox")" = 0 ]; then s=; fi
          exec "$d/project-workspace-bin" $s "$@"
          SH
          mv "$out/LICENSE" "$out/LICENSE.electron.txt"
          rm -f "$out/resources/default_app.asar"
          cp -r tools/electron/bootstrap "$out/resources/app"
          node -e "const f=process.argv[1];const p=require(f);p.version='${{ steps.v.outputs.version }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2))" "$PWD/$out/resources/app/package.json"
          # server mode for machines without a desktop: the same runtime, running as plain Node
          cat > "$out/project-workspace-server" <<'SH'
          #!/bin/sh
          # Runs the workspace without a window (servers without a desktop). Same options as the app.
          d=$(dirname "$(readlink -f "$0")")
          PW_EXE="$d/project-workspace" PW_ELECTRON=1 PW_SERVER=1 ELECTRON_RUN_AS_NODE=1 exec "$d/project-workspace-bin" "$d/app/server.js" "$@"
          SH
          sed -i 's/^          //' "$out/project-workspace-server"
          chmod 755 "$out/project-workspace-server"
          node -e "const fs=require('fs');fs.writeFileSync(process.argv[1]+'/runtime.json',JSON.stringify({electron:'${{ steps.e.outputs.electron }}',platform:'linux',arch:'${{ matrix.arch }}',files:fs.readdirSync(process.argv[1])},null,2))" "$out"
          sed -i 's/^          //' "$out/project-workspace"
          chmod 755 "$out/project-workspace" "$out/project-workspace-bin" "$out/chrome_crashpad_handler" 2>/dev/null || true
          # 2. the program (replaced by updates; data/ is never in the package)
          git archive --format=tar HEAD app docs tools README.md LICENSE package.json | tar -x -C "$out"
          rm -rf "$out/tools/electron"
      - name: Check the app starts and shows the workspace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libgbm1 libgtk-3-0t64 libasound2t64 libxss1 > /dev/null
          export WORKSPACE_DIR="$RUNNER_TEMP/pw-data" PW_SMOKE_FILE="$RUNNER_TEMP/smoke.txt"
          timeout 120 xvfb-run -a dist/project-workspace/project-workspace 4399 || true
          r=$(cat "$PW_SMOKE_FILE" 2>/dev/null); echo "Check: $r"
          echo "$r" | grep -Eq "^OK ${{ steps.v.outputs.version }} .* exe true$" || { echo "App check failed"; exit 1; }
      - name: Check the MCP server runs with the app's runtime
        run: |
          export WORKSPACE_DIR="$RUNNER_TEMP/pw-data"
          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | ELECTRON_RUN_AS_NODE=1 dist/project-workspace/project-workspace-bin dist/project-workspace/app/mcp.js)
          echo "$out"; echo "$out" | grep -q project-workspace
      - name: Check the server mode (no window)
        run: |
          export WORKSPACE_DIR="$RUNNER_TEMP/pw-data"
          dist/project-workspace/project-workspace-server 4398 > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for i in $(seq 1 30); do sleep 1; curl -fsS http://localhost:4398/api/info -o "$RUNNER_TEMP/info.json" && break; done
          kill $pid 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"
          node -e "const i=require(process.argv[1]); if(i.version!=='${{ steps.v.outputs.version }}'||!i.exe) process.exit(1); console.log('server OK', i.version)" "$RUNNER_TEMP/info.json"
      - name: Zip
        id: zip
        run: |
          name="project-workspace-v${{ steps.v.outputs.version }}-linux-${{ matrix.arch }}.zip"
          (cd dist && zip -qry "$name" project-workspace)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/${{ steps.zip.outputs.name }}
          if-no-files-found: error
      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "dist/${{ steps.zip.outputs.name }}" --clobber
