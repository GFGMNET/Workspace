# Builds the portable Linux app: "project-workspace" (contains Node, made with Node's single
# executable application feature) + the app folder, zipped (the executable bit is kept).
#  - Run by hand: Actions → "Build Linux app" → Run workflow  (zips appear under the run's Artifacts)
#  - Called by the Release workflow: the zips are attached to the release
name: Build Linux app

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the zips to
        type: string
        required: false

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: v
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          node --version; uname -m
      - name: Tests
        run: node app/test/smoke.js
      - name: Assemble the package folder
        run: |
          out=dist/project-workspace
          mkdir -p "$out"
          git archive --format=tar HEAD app docs tools README.md LICENSE package.json | tar -x -C "$out"
          rm -rf "$out/tools/sea"
      - name: Build the executable (Node single executable application)
        run: |
          mkdir -p build
          node --experimental-sea-config tools/sea/sea-config.json
          exe=dist/project-workspace/project-workspace
          cp "$(command -v node)" "$exe"
          chmod u+w "$exe"
          npx --yes postject@1.0.0-alpha.6 "$exe" NODE_SEA_BLOB build/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 --overwrite
          chmod 755 "$exe"
      - name: Check the executable starts
        run: |
          exe="$PWD/dist/project-workspace/project-workspace"
          v=$("$exe" --version)
          [ "$v" = "${{ steps.v.outputs.version }}" ] || { echo "exe --version said '$v'"; exit 1; }
          export WORKSPACE_DIR="$RUNNER_TEMP/pw-data"
          "$exe" --no-open 4399 > "$RUNNER_TEMP/exe.log" 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS http://localhost:4399/api/info -o "$RUNNER_TEMP/info.json"; then break; fi
          done
          kill $pid 2>/dev/null || true
          cat "$RUNNER_TEMP/exe.log"
          node -e "const i=require(process.argv[1]); if(i.version!=='${{ steps.v.outputs.version }}'||!i.exe) process.exit(1); console.log('exe OK:', i.version, i.root)" "$RUNNER_TEMP/info.json"
      - name: Zip
        id: zip
        run: |
          name="project-workspace-v${{ steps.v.outputs.version }}-linux-${{ matrix.arch }}.zip"
          (cd dist && zip -qry "$name" project-workspace)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/${{ steps.zip.outputs.name }}
          if-no-files-found: error
      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "dist/${{ steps.zip.outputs.name }}" --clobber
