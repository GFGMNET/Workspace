# Version 1.0 in Rust (docs/MIGRATION-RUST.md): builds and checks the prototype on Linux and Windows.
# The zips (artifacts of the run) hold the desktop app (Tauri), the server and the screens.
name: Rust (1.0 prototype)

on:
  push:
    branches: [main]
    paths: ['rust/**', 'app/public/**', 'tests/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      PW_INSTALL: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: System libraries for the window (WebKitGTK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev xvfb > /dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Unit tests
        working-directory: rust
        run: cargo test --workspace --release
      - name: Build
        working-directory: rust
        run: cargo build --workspace --release --locked
      - name: Server answers
        run: |
          export WORKSPACE_DIR="$RUNNER_TEMP/data"
          rust/target/release/workspace-server 4396 &
          for i in $(seq 1 30); do sleep 0.5; curl -fsS http://localhost:4396/api/info >/dev/null && break; done
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:4396/api/examples
          curl -fsS http://localhost:4396/api/projects | head -c 300; echo
          curl -fsS http://localhost:4396/api/projects/home-lab/f/wiki/items | head -c 300; echo
          curl -fsS http://localhost:4396/ | head -c 100; echo
      - name: Desktop app starts (window on a virtual screen)
        run: |
          export WORKSPACE_DIR="$RUNNER_TEMP/data2"
          xvfb-run -a rust/target/release/workspace 4395 > /tmp/app.log 2>&1 &
          ok=0; for i in $(seq 1 40); do sleep 0.5; curl -fsS http://localhost:4395/api/info >/dev/null && { ok=1; break; }; done
          sleep 3; cat /tmp/app.log; [ $ok = 1 ] && echo "app OK" || { echo "app did not answer"; exit 1; }
      - name: YAML corpus against the Rust reader
        env:
          PW_YAML_CMD: ${{ github.workspace }}/rust/target/release/workspace-server yaml
        run: node --test tests/yaml-corpus/yaml.test.js
      - name: API contract tests against the Rust server (and its MCP server)
        env:
          PW_SERVER_CMD: ${{ github.workspace }}/rust/target/release/workspace-server {port}
          PW_MCP_CMD: ${{ github.workspace }}/rust/target/release/workspace-server mcp
        run: node tests/contract/run.js
      - name: VS Code tab (docs/plans/VSCODE.md) — real VS Code in a real browser
        shell: bash
        timeout-minutes: 20
        env:
          PW_INSTALL: ${{ github.workspace }}
          PW_SERVER_CMD: ${{ github.workspace }}/rust/target/release/workspace-server {port}
        run: |
          T="$RUNNER_TEMP"; command -v cygpath > /dev/null && T="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$T/vscode"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -sSL -o "$T/vscode.zip" "https://update.code.visualstudio.com/latest/win32-x64-archive/stable"
            unzip -q "$T/vscode.zip" -d "$T/vscode"
            npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null && npx playwright install chromium > /dev/null
          else
            curl -sSL -o "$T/vscode.tgz" "https://update.code.visualstudio.com/latest/linux-x64/stable"
            tar -xzf "$T/vscode.tgz" -C "$T/vscode" --strip-components=1
            npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          fi
          PATH="$T/vscode/bin:$PATH" node docs/plans/checks/vscode-check.js
      - name: Package
        run: |
          d=dist/workspace-proto
          mkdir -p $d/app
          cp rust/target/release/workspace rust/target/release/workspace-server $d/
          cp -r app/public app/starter $d/app/
          (cd dist && zip -qry workspace-proto-linux-x64.zip workspace-proto)
          ls -l dist/*.zip; du -sh rust/target/release/workspace rust/target/release/workspace-server
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-proto-linux-x64
          path: dist/workspace-proto-linux-x64.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build
        working-directory: rust
        run: cargo build --workspace --release --locked
      - name: Unit tests
        working-directory: rust
        run: cargo test -p pw-core -p pw-server --release
      - name: YAML corpus against the Rust reader
        env:
          PW_YAML_CMD: ${{ github.workspace }}\rust\target\release\workspace-server.exe yaml
        run: node --test tests/yaml-corpus/yaml.test.js
      - name: API contract tests against the Rust server (and its MCP server)
        env:
          PW_INSTALL: ${{ github.workspace }}
          PW_SERVER_CMD: ${{ github.workspace }}\rust\target\release\workspace-server.exe {port}
          PW_MCP_CMD: ${{ github.workspace }}\rust\target\release\workspace-server.exe mcp
        run: node tests/contract/run.js
      - name: VS Code tab (docs/plans/VSCODE.md) — real VS Code in a real browser
        shell: bash
        timeout-minutes: 20
        env:
          PW_INSTALL: ${{ github.workspace }}
          PW_SERVER_CMD: ${{ github.workspace }}\rust\target\release\workspace-server.exe {port}
        run: |
          T="$RUNNER_TEMP"; command -v cygpath > /dev/null && T="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$T/vscode"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -sSL -o "$T/vscode.zip" "https://update.code.visualstudio.com/latest/win32-x64-archive/stable"
            unzip -q "$T/vscode.zip" -d "$T/vscode"
            npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null && npx playwright install chromium > /dev/null
          else
            curl -sSL -o "$T/vscode.tgz" "https://update.code.visualstudio.com/latest/linux-x64/stable"
            tar -xzf "$T/vscode.tgz" -C "$T/vscode" --strip-components=1
            npm i --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          fi
          PATH="$T/vscode/bin:$PATH" node docs/plans/checks/vscode-check.js
      - name: Signing with the own certificate (test certificate; docs/plans/SIGNING.md)
        timeout-minutes: 10
        run: pwsh docs/plans/checks/signing-check.ps1 -Exe rust/target/release/workspace-server.exe
      - name: Package
        run: |
          $d = "dist/Workspace-proto"
          New-Item -ItemType Directory -Force "$d/app" | Out-Null
          Copy-Item rust/target/release/workspace.exe "$d/Workspace.exe"
          Copy-Item rust/target/release/workspace-server.exe $d
          Copy-Item -Recurse app/public, app/starter "$d/app"
          Get-ChildItem $d -File | Select-Object Name, Length
      - name: Server and app answer
        run: |
          $env:WORKSPACE_DIR = Join-Path $env:RUNNER_TEMP 'data'
          $s = Start-Process dist/Workspace-proto/workspace-server.exe -ArgumentList 4396 -PassThru -WindowStyle Hidden
          $ok = $false; for ($i = 0; $i -lt 30 -and -not $ok; $i++) { Start-Sleep -Milliseconds 500; try { Invoke-RestMethod http://localhost:4396/api/info | Out-Null; $ok = $true } catch {} }
          Stop-Process -Id $s.Id -Force
          if (-not $ok) { throw 'server did not answer' }
          $env:WORKSPACE_DIR = Join-Path $env:RUNNER_TEMP 'data2'
          $a = Start-Process dist/Workspace-proto/Workspace.exe -ArgumentList 4395 -PassThru
          $ok = $false; for ($i = 0; $i -lt 40 -and -not $ok; $i++) { Start-Sleep -Milliseconds 500; try { $r = Invoke-RestMethod http://localhost:4395/api/info; $ok = $true } catch {} }
          Start-Sleep 3; $alive = -not $a.HasExited
          Stop-Process -Id $a.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'app did not answer' }
          Write-Host "app OK (window process alive: $alive), version $($r.version)"
      - name: Zip
        run: Compress-Archive -Path dist/Workspace-proto -DestinationPath dist/workspace-proto-windows-x64.zip; Get-Item dist/*.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-proto-windows-x64
          path: dist/workspace-proto-windows-x64.zip
