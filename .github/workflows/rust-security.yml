# Security check of version 1.0's crates (Rust libraries): known vulnerabilities (RustSec), licences and sources,
# with cargo-deny (rust/deny.toml). Runs on every change in rust/, every Monday, and by hand.
# On the weekly run a finding opens an issue, so a new vulnerability in a library is not missed (#72).
name: Rust security check

on:
  push:
    branches: [main]
    paths: ['rust/**', '.github/workflows/rust-security.yml']
  schedule:
    - cron: '41 4 * * 1'   # Mondays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories licenses sources bans
          arguments: --workspace
      # weekly run AND every change on main: a finding must not go unnoticed (2026-11-24: a push failure was missed for a day)
      - name: Open an issue (if none is open yet)
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label security-check --state open --search "Rust security check found a problem in:title" --json number --jq length)
          [ "$open" != "0" ] && { echo "an issue is already open"; exit 0; }
          gh issue create --repo "$GITHUB_REPOSITORY" --label security-check \
            --title "Rust security check found a problem ($(date -u +%F))" \
            --body "The cargo-deny check failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — usually a crate with a known vulnerability that needs an update."
