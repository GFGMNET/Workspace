# Builds version 1.0 (Rust + Tauri) for Windows 11 x64 and Linux x64 (no arm64: #64) and publishes it as a
# GitHub **pre-release** v<version> (version from rust/Cargo.toml), or with `final` a full release (1.0.0+, maintainer's OK). Installed 0.x apps only look at the
# latest full release, so nobody gets a pre-release by accident. Run by hand: Actions → "Build 1.0 (Rust)".
# Every package gets a build attestation (gh attestation verify <zip> -R GFGMNET/Workspace) and is listed
# with its SHA-256 in SHA256SUMS, which the 1.0 updater checks on Linux (docs/plans/RELEASE-TRUST.md). The Windows programs are
# signed with the project's own certificate (signing/, docs/plans/SIGNING.md); the updater only accepts that signature.
name: Build 1.0 (Rust)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.9.0.5 for a beta (empty: the version in rust/Cargo.toml)"
        required: false
      final:
        description: "Full release (only 1.0.0 and later, with the maintainer's OK): installed 0.6.3 apps are offered it"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          VERSION_IN: ${{ inputs.version }}
        run: |
          v="$VERSION_IN"
          [ -n "$v" ] || v=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          case "$v" in *[!0-9.]*|.*|*.) echo "::error::Version must be numbers and dots, e.g. 0.9.0.5 (now: $v)"; exit 1;; esac
          case "$v" in *-proto*|"") echo "::error::Set a real version in rust/Cargo.toml (now: $v)"; exit 1;; esac
          if git ls-remote --exit-code --tags origin "v$v" >/dev/null; then echo "::error::v$v already exists — raise the version first"; exit 1; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    env:
      PW_INSTALL: ${{ github.workspace }}
      PW_VERSION: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: System libraries for the window
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev > /dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --workspace --release --locked
      - name: Tests (unit, YAML corpus, API contract)
        env:
          PW_YAML_CMD: ${{ github.workspace }}/rust/target/release/workspace-server yaml
          PW_SERVER_CMD: ${{ github.workspace }}/rust/target/release/workspace-server {port}
          PW_MCP_CMD: ${{ github.workspace }}/rust/target/release/workspace-server mcp
        run: |
          (cd rust && cargo test -p pw-core -p pw-server --release)
          node --test tests/yaml-corpus/yaml.test.js
          node tests/contract/run.js
      - name: Package
        run: |
          v=${{ needs.version.outputs.v }}
          d=dist/workspace
          mkdir -p $d/app
          cp rust/target/release/workspace rust/target/release/workspace-server $d/
          cp -r app/public app/starter $d/app/
          # Help & wiki inside the app (plan HELP): the wiki pages and their pictures come with the program
          node tools/build-wiki.js $d/app/help/pages && mkdir -p $d/app/help/screenshots && cp docs/screenshots/* $d/app/help/screenshots/
          cp LICENSE $d/ 2>/dev/null || true
          (cd dist && zip -qry "workspace-v$v-linux-${{ matrix.arch }}.zip" workspace)
          ls -l dist/*.zip
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.zip

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PW_INSTALL: ${{ github.workspace }}
      PW_VERSION: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --workspace --release --locked
      - name: Tests (unit, YAML corpus, API contract)
        env:
          PW_YAML_CMD: ${{ github.workspace }}\rust\target\release\workspace-server.exe yaml
          PW_SERVER_CMD: ${{ github.workspace }}\rust\target\release\workspace-server.exe {port}
          PW_MCP_CMD: ${{ github.workspace }}\rust\target\release\workspace-server.exe mcp
        run: |
          Push-Location rust; cargo test -p pw-core -p pw-server --release; if ($LASTEXITCODE) { exit 1 }; Pop-Location
          node --test tests/yaml-corpus/yaml.test.js; if ($LASTEXITCODE) { exit 1 }
          node tests/contract/run.js; if ($LASTEXITCODE) { exit 1 }
      - name: Sign with the project's own certificate (docs/plans/SIGNING.md)
        run: |
          if (-not (Test-Path signing/workspace-signing.pfx)) { throw "signing/workspace-signing.pfx is missing - no unsigned Windows release" }
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object FullName -match 'x64' | Select-Object -Last 1).FullName
          $want = (Get-Content -Raw signing/workspace-signing.thumbprint).Trim()
          foreach ($f in 'rust/target/release/workspace.exe', 'rust/target/release/workspace-server.exe') {
            & $signtool sign /f signing/workspace-signing.pfx /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f | Out-Null
            if ($LASTEXITCODE) { throw "Signing $f failed" }
            $sig = Get-AuthenticodeSignature $f
            if ($sig.SignerCertificate.Thumbprint -ne $want -or $sig.Status -eq 'HashMismatch') { throw "Wrong signature on $f ($($sig.Status))" }
            Write-Host "signed: $f"
          }
      - name: Package
        run: |
          $v = "${{ needs.version.outputs.v }}"
          $d = "dist/Workspace"
          New-Item -ItemType Directory -Force "$d/app" | Out-Null
          Copy-Item rust/target/release/workspace.exe "$d/Workspace.exe"
          Copy-Item rust/target/release/workspace-server.exe $d
          Copy-Item -Recurse app/public, app/starter "$d/app"
          node tools/build-wiki.js "$d/app/help/pages"
          New-Item -ItemType Directory -Force "$d/app/help/screenshots" | Out-Null
          Copy-Item docs/screenshots/* "$d/app/help/screenshots"
          if (Test-Path LICENSE) { Copy-Item LICENSE $d }
          Compress-Archive -Path $d -DestinationPath "dist/workspace-v$v-windows-x64.zip"
          Get-Item dist/*.zip | Select-Object Name, Length
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*.zip

  publish:
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.version.outputs.v }}
          cp signing/workspace-signing.cer dist/
          cd dist && sha256sum *.zip workspace-signing.cer > SHA256SUMS && cat SHA256SUMS && cd ..
          notes="docs/releases/v$v.md"
          # every release page says how the Windows program is signed and how to trust the certificate
          fp=$(cat signing/workspace-signing.thumbprint)
          { [ -f "$notes" ] && cat "$notes"; printf '\n\n---\n**Windows:** signed with the project'"'"'s own certificate "Workspace" (fingerprint `%s`). Windows warns until you install it once: [how to trust the certificate](https://github.com/GFGMNET/Workspace/wiki/Signing-certificate) · file `workspace-signing.cer` below.\n' "$fp"; } > /tmp/notes.md
          n=(--notes-file /tmp/notes.md)
          if [ "${{ inputs.final }}" = true ]; then
            gh release create "v$v" dist/*.zip dist/workspace-signing.cer dist/SHA256SUMS --latest --target "$GITHUB_SHA" --title "Workspace v$v" "${n[@]}"
          else
            gh release create "v$v" dist/*.zip dist/workspace-signing.cer dist/SHA256SUMS --prerelease --target "$GITHUB_SHA" --title "Workspace v$v (1.0 beta, Rust)" "${n[@]}"
          fi
