# Builds the Windows desktop app: "ProjectWorkspace.exe" (Electron: its own window, Node and the
# browser engine included) + the app folder, zipped. Nothing to install.
#  - Run by hand: Actions → "Build Windows app" → Run workflow  (zip appears under the run's Artifacts)
#  - Called by the Release workflow: the zip is attached to the release
name: Build Windows app

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: Commit to build (draft releases have no tag yet)
        type: string
        required: false
      tag:
        description: Release tag to attach the zip to
        type: string
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: v
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Tests
        run: node app/test/smoke.js
      - name: Get Electron
        id: e
        run: |
          $major = (Get-Content tools/electron/electron-version).Trim()
          npm install --prefix build/electron "electron@$major" --no-save --no-audit --no-fund --foreground-scripts
          # newer npm versions may skip install scripts: download Electron's files explicitly
          if (-not (Test-Path build/electron/node_modules/electron/dist)) { node build/electron/node_modules/electron/install.js }
          if (-not (Test-Path build/electron/node_modules/electron/dist/electron.exe)) { throw "Electron download failed" }
          $ev = node -p "require('./build/electron/node_modules/electron/package.json').version"
          "electron=$ev" >> $env:GITHUB_OUTPUT
          Write-Host "Electron $ev"
      - name: Assemble the package folder
        run: |
          $out = "dist/ProjectWorkspace"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # 1. the Electron runtime, renamed, with our bootstrap instead of Electron's default app
          Copy-Item -Recurse build/electron/node_modules/electron/dist/* $out
          Rename-Item "$out/electron.exe" "ProjectWorkspace.exe"
          Rename-Item "$out/LICENSE" "LICENSE.electron.txt"
          Remove-Item -Force "$out/resources/default_app.asar" -ErrorAction SilentlyContinue
          Copy-Item -Recurse tools/electron/bootstrap "$out/resources/app"
          node -e "const f=require('path').resolve(process.argv[1]);const p=require(f);p.version=process.argv[2];require('fs').writeFileSync(f,JSON.stringify(p,null,2))" "$out/resources/app/package.json" "${{ steps.v.outputs.version }}"
          $files = Get-ChildItem $out | ForEach-Object { $_.Name }
          @{ electron = "${{ steps.e.outputs.electron }}"; platform = "win32"; arch = "x64"; files = @($files) } | ConvertTo-Json | Set-Content "$out/runtime.json"
          # 2. the program (replaced by updates; data/ is never in the package)
          git archive --format=tar HEAD app docs tools README.md LICENSE package.json | tar -x -C $out
          Remove-Item -Recurse -Force "$out/tools/electron" -ErrorAction SilentlyContinue
          # 3. icon and file details
          npm install --prefix build/rcedit rcedit@4.0.1 --no-save --no-audit --no-fund
          $rcedit = Get-ChildItem -Recurse build/rcedit/node_modules/rcedit -Filter "rcedit-x64.exe" | Select-Object -First 1
          & $rcedit.FullName "$out/ProjectWorkspace.exe" --set-icon tools/electron/icon.ico `
            --set-version-string "ProductName" "Project Workspace" `
            --set-version-string "FileDescription" "Project Workspace" `
            --set-version-string "CompanyName" "GFGMNET" `
            --set-version-string "LegalCopyright" "MIT License" `
            --set-version-string "OriginalFilename" "ProjectWorkspace.exe" `
            --set-file-version "${{ steps.v.outputs.version }}" --set-product-version "${{ steps.v.outputs.version }}"
          if ($LASTEXITCODE) { throw "rcedit failed" }
      - name: Check the app starts and shows the workspace
        run: |
          $exe = Resolve-Path "dist/ProjectWorkspace/ProjectWorkspace.exe"
          $env:WORKSPACE_DIR = Join-Path $env:RUNNER_TEMP "pw-data"
          $env:PW_SMOKE_FILE = Join-Path $env:RUNNER_TEMP "smoke.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "4399" -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "The app did not finish its check in time" }
          $r = Get-Content $env:PW_SMOKE_FILE -ErrorAction SilentlyContinue
          Write-Host "Check: $r"
          if ("$r" -notmatch "^OK ${{ steps.v.outputs.version }} .* exe true$") { throw "App check failed: $r" }
      - name: Check the MCP server runs with the app's runtime
        run: |
          # spawned with pipes like Claude CLI does (PowerShell doesn't pipe GUI programs reliably)
          $env:WORKSPACE_DIR = Join-Path $env:RUNNER_TEMP "pw-data"
          node -e "const {spawn}=require('child_process');const d=require('path').resolve('dist/ProjectWorkspace');const c=spawn(d+'/ProjectWorkspace.exe',[d+'/app/mcp.js'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'}});let o='';c.stdout.on('data',x=>{o+=x;if(o.includes('serverInfo')){console.log(o.slice(0,200));process.exit(o.includes('project-workspace')?0:1)}});c.stdin.write(JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'ci',version:'1'}}})+'\n');setTimeout(()=>{console.log('no answer: '+o);process.exit(1)},30000)"
      - name: Check the signing tools with the app's runtime
        run: |
          # the same way a maintainer runs them (Windows PowerShell, the app's own exe as Node)
          $d = Join-Path $env:RUNNER_TEMP 'sign'; New-Item -ItemType Directory -Force $d | Out-Null
          $key = Join-Path $d 'test.key'
          $env:PW_SIGN_PASSWORD = 'ci test password 123'
          $o = powershell -NoProfile -ExecutionPolicy Bypass -File dist/ProjectWorkspace/tools/signing/signing.ps1 new-key -KeyFile $key 6>&1 | Out-String
          Write-Host $o
          if ($o -notmatch 'BEGIN PUBLIC KEY') { throw 'new-key did not show the public key' }
          if (-not (Test-Path $key)) { throw 'new-key made no key' }
          "project-workspace v9.9.9`nabc  x.zip" | Set-Content -NoNewline (Join-Path $d 'SHA256SUMS.txt')
          $o = powershell -NoProfile -ExecutionPolicy Bypass -File dist/ProjectWorkspace/tools/signing/signing.ps1 sign (Join-Path $d 'SHA256SUMS.txt') -KeyFile $key -Yes 6>&1 | Out-String
          Write-Host $o
          if ($o -notmatch 'Signed:') { throw 'sign did not report success' }
          node dist/ProjectWorkspace/tools/signing/signing.js verify (Join-Path $d 'SHA256SUMS.txt') ($key -replace '\.key$', '.pub.pem')
          if ($LASTEXITCODE) { throw 'signature check failed' }
          Remove-Item Env:PW_SIGN_PASSWORD
      - name: Zip
        id: zip
        run: |
          $name = "project-workspace-v${{ steps.v.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist/ProjectWorkspace -DestinationPath "dist/$name"
          "name=$name" >> $env:GITHUB_OUTPUT
          Get-Item "dist/$name" | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/${{ steps.zip.outputs.name }}
          if-no-files-found: error
      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # electron-version.txt: which browser engine this release ships (read by the weekly security check)
          "${{ steps.e.outputs.electron }}" | Set-Content -NoNewline dist/electron-version.txt
          gh release upload "${{ inputs.tag }}" "dist/${{ steps.zip.outputs.name }}" dist/electron-version.txt --clobber
